<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a2118">
<title>Realm of Many</title>
<meta property="og:title" content="Realm of Many — a realm built by its followers">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e7e0cc;font-family:Georgia,"Times New Roman",serif;color:#2a2118;-webkit-text-size-adjust:100%}
  canvas{position:fixed;inset:0;display:block}
  .karte{position:fixed;left:12px;right:12px;background:rgba(253,246,228,.92);border:1.5px solid #8a6a3c;border-radius:14px;box-shadow:0 4px 16px rgba(50,30,10,.22)}
  #kopf{top:calc(10px + env(safe-area-inset-top));padding:10px 14px}
  #kopf h1{margin:0;font-size:21px;letter-spacing:.3px}
  #kopfzahl{font-size:14px;margin-top:2px;color:#5c4526}
  #wunsch{font-size:13.5px;margin-top:7px;line-height:1.35;border-top:1px dotted #b59a6a;padding-top:6px}
  #wunsch span{color:#7a5a30}
  #unten{bottom:calc(12px + env(safe-area-inset-bottom));padding:10px 12px 9px}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;font:16px Georgia,serif;padding:10px 12px;border:1.5px solid #8a6a3c;border-radius:10px;background:#fffaf0;color:#2a2118}
  button{font:600 15px Georgia,serif;padding:0 14px;border:0;border-radius:10px;background:#7a3f22;color:#fff6e4}
  #meldung{font-size:13.5px;margin:7px 2px 0;display:none;line-height:1.3}
  #meldung.zeigen{display:block}
  #optout{font-size:11.5px;color:#7a6446;margin:6px 2px 0}
  #schilder{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .schild{position:absolute;left:0;top:0;background:#4a3020;color:#fbefd6;border:1.5px solid #c9a04a;border-radius:6px;padding:2px 7px;font:12px Georgia,serif;white-space:nowrap;display:none}
  .schild span{display:block;line-height:1.35}
  .schild.an{background:#c9822c;color:#fff;border-color:#ffe6a0;font-size:14px;padding:4px 10px;box-shadow:0 0 18px 6px rgba(255,190,80,.85);animation:gluehen 1.4s ease-in-out infinite;z-index:2}
  @keyframes gluehen{50%{box-shadow:0 0 30px 12px rgba(255,200,90,1)}}
  #laden{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#5c4526;background:#e7e0cc;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="schilder"></div>
<div id="kopf" class="karte"><h1>Realm of Many</h1><div id="kopfzahl">…</div><div id="wunsch"></div></div>
<div id="unten" class="karte">
  <form id="form" autocomplete="off"><input id="suche" placeholder="Find your house — @yourname" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search"><button>Find</button></form>
  <div id="meldung"></div>
  <div id="optout">Every follower gets a house. Don't want your house shown? DM us.</div>
</div>
<div id="laden">The fog is lifting…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
  addEventListener("error", e => window.__fehler = String(e.message)); addEventListener("unhandledrejection", e => window.__fehler = String(e.reason));
  await import("./welt.js");
  const l = document.getElementById("laden"); l.style.opacity = 0; setTimeout(() => l.remove(), 700);
</script>
</body>
</html>
